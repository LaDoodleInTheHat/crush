<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>crush - log in</title>
  <link rel="icon" href="/_/icon.svg">
  <style>
    :root {
      --bg: #f3f3f6; --field: #fff; --text: #1d1d22; --muted: #6b6b76; --border: #cfcfd8; --accent: #e8457a;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1b20; --field: #2a2a31; --text: #e9e9ee; --muted: #9a9aa6; --border: #33333b; --accent: #ff6f9c; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body {
      display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 0 16px;
      background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    form { width: min(320px, 100%); text-align: center; }
    .face { color: var(--accent); font-size: 1.4rem; }
    h1 { margin: 4px 0 24px; font-size: 2rem; letter-spacing: -.04em; }
    input, button { width: 100%; height: 44px; border-radius: 22px; font: inherit; }
    input { padding: 0 18px; border: 1px solid var(--border); background: var(--field); color: inherit; outline: none; }
    input:focus { border-color: var(--accent); }
    button { margin-top: 10px; border: 0; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
    .error { min-height: 1.4em; margin: 12px 0 0; color: var(--accent); }
  </style>
</head>
<body>
  <!-- target="_top": if this page shows up inside a tab, log in the whole window -->
  <form method="post" action="/_/login" target="_top">
    <div class="face" aria-hidden="true">(・_・)ノ</div>
    <h1>crush</h1>
    <input type="password" name="password" placeholder="Password" aria-label="Password" autofocus required>
    <button type="submit">Log in</button>
    <p class="error" id="error"></p>
  </form>
  <script>
    if (location.search.includes('wrong')) document.getElementById('error').textContent = 'Wrong password, try again.';
  </script>
</body>
</html>
